# Ansible Inventory 示例
# 使用: ansible-playbook -i inventory.ini sync_project.yml

[all:vars]
ansible_user=root
# 推荐用 SSH 密钥，避免明文密码
# ansible_ssh_private_key_file=~/.ssh/id_ed25519
# 若必须用密码（仅测试环境）:
# ansible_password=your_password
# ansible_ssh_common_args='-o StrictHostKeyChecking=no'

# ---------- 按环境分组 ----------
[dev]
# dev-app-01 ansible_host=192.168.1.10
# dev-app-02 ansible_host=192.168.1.11

[staging]
# staging-app-01 ansible_host=10.0.1.10

[prod]
# prod-app-01 ansible_host=10.0.2.10
# prod-app-02 ansible_host=10.0.2.11

# ---------- 按角色分组 ----------
[webservers:children]
dev
staging
prod

[dbservers]
# db-01 ansible_host=10.0.3.10

# 本地测试（本机当目标）
[local]
localhost ansible_connection=local
